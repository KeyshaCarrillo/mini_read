name: admin_dashboard
description: Enterprise Flutter Web dashboard for Mini Read platform administrators.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  data_table_2: ^2.6.0
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.0.3
  google_fonts: ^6.3.2
  http: ^1.5.0
  responsive_framework: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
